report_comment: >
  This report has been generated by the <a href="https://github.com/johannesnicolaus/nanoplasty-nf/tree/dev" target="_blank">johannesnicolaus/nanoplasty-nf</a>
  analysis pipeline.
report_section_order:
  organelle_summary:
    order: 1000
  "johannesnicolaus-nanoplasty-nf-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "johannesnicolaus-nanoplasty-nf-summary":
    order: -1002

export_plots: true

disable_version_detection: true

module_order:
  - nanostat
  - seqkit
  - samtools
  - mosdepth
  - quast

custom_data:
  organelle_summary:
    id: "organelle_summary"
    section_name: "Organelle assemblies"
    description: >
      One row per sample: assembly size and GC, read depth after mapping the reads back to the
      circularised assembly, reads spanning the start/end of the circle (support for circularity),
      and annotated gene counts.
    plot_type: "table"
    pconfig:
      id: "organelle_summary_table"
      namespace: "Organelle"

sp:
  organelle_summary:
    fn: "organelle_summary_mqc.tsv"

custom_content:
  order:
    - organelle_summary

mosdepth_config:
  include_contigs:
    - "*"
