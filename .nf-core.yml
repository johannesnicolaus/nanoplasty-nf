repository_type: pipeline

nf_core_version: 4.2.1

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-nanoplasty_logo_light.png
    - docs/images/nf-core-nanoplasty_logo_light.png
    - docs/images/nf-core-nanoplasty_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - docs/CONTRIBUTING.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-nanoplasty_logo_light.png
    - docs/images/nf-core-nanoplasty_logo_light.png
    - docs/images/nf-core-nanoplasty_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: johannesnicolaus
  name: nanoplasty
  description: Organelle genome assembly from long reads with NANOPlasty, plus QC,
    annotation and circular plots
  author: Johannes Nicolaus Wibisana
  version: 0.1.0dev
  force: true
  outdir: nanoplasty-nf
  skip_features:
    - igenomes
    - fastqc
    - gpu
    - codespaces
    - seqera_platform
  is_nfcore: false
